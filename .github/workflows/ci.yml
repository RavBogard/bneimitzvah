name: CI
# A change is tested once, through its pull request, which tests the exact merge result; main is not retested after a merge. Run it by hand with workflow_dispatch when needed. A newer commit on the same pull request cancels the run it supersedes.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The app Vitest suite is split four ways per OS (vitest --shard); the engine suite (node --test), typecheck and the
  # Windows build run once per OS in "unit-static". Together the legs run exactly what `npm test` and the old unit job ran.
  unit:
    name: unit (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:app -- --shard=${{ matrix.shard }}/4
  unit-static:
    name: unit-static (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:node
      - run: npm run typecheck
      # Ubuntu's build is the separate build job below, which the postgres and browser jobs reuse; only Windows builds here.
      - run: npm run build
        if: matrix.os == 'windows-latest'
        env:
          # CRC's identity needs a positive signal (src/lib/site/identity.ts); the built pages must be CRC's, as the browser gate's server is.
          BETTER_AUTH_URL: https://beitmitzvah.centralreform.org
  # The one Ubuntu build of the pull request. The postgres and browser jobs download .next instead of building it again.
  # next start (the browser job and production-denial.test.ts) reads only .next plus the checkout; the output is not standalone.
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The browser gate's server runs as CRC (tests/helpers/builtE2eServer.mjs); prerendered pages must carry the same identity.
          BETTER_AUTH_URL: https://beitmitzvah.centralreform.org
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: portal_rls_test
          POSTGRES_USER: postgres
          # Public synthetic credential for this disposable CI container only.
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify migrated RLS and access-service revocation races
        run: npm run test:postgres
        env:
          POSTGRES_TEST_DISPOSABLE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: portal_rls_test
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
  http-browser:
    name: http-browser (shard ${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: portal_rls_test
          POSTGRES_USER: postgres
          # Public synthetic credential for this disposable CI container only.
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers and OS packages come from the Actions cache so this job does not wait on the
      # runner's apt mirror, which has stalled these jobs for 10+ minutes. See ci-system-packages.sh.
      - name: Resolve browser and package cache keys
        id: keys
        run: |
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          if [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ]; then
            echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Runner image version unknown; packages will not be reused"
            echo "image=unknown-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      # The cache matches a key by prefix too, so no key may be a prefix of another job's key.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-firefox-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.playwright }}
      - run: npx playwright install chromium firefox
        timeout-minutes: 10
      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-firefox-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.playwright }}
      - name: Restore browser system packages and synthetic reference-audio test encoder
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-apt-debs
          key: ci-apt-debs-postgres-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/scripts/ci-system-packages.sh') }}
      - name: Install browser system packages and synthetic reference-audio test encoder
        id: packages
        timeout-minutes: 12
        run: bash .github/scripts/ci-system-packages.sh "${{ steps.debs.outputs.cache-hit }}" "chromium firefox" ffmpeg pulseaudio pulseaudio-utils
      - name: Save browser system packages and synthetic reference-audio test encoder
        if: steps.debs.outputs.cache-hit != 'true' && steps.packages.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ci-apt-debs
          key: ci-apt-debs-postgres-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/scripts/ci-system-packages.sh') }}
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Exercise browser HTTP authority and built production denial
        run: npm run test:http:browser -- --shard=${{ matrix.shard }}/6
        env:
          POSTGRES_TEST_DISPOSABLE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: portal_rls_test
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
  browser:
    name: browser (shard ${{ matrix.shard }}/2)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browsers and OS packages come from the Actions cache so this job does not wait on the
      # runner's apt mirror, which has stalled these jobs for 10+ minutes. See ci-system-packages.sh.
      - name: Resolve browser and package cache keys
        id: keys
        run: |
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          if [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ]; then
            echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Runner image version unknown; packages will not be reused"
            echo "image=unknown-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      # The cache matches a key by prefix too, so no key may be a prefix of another job's key.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.playwright }}
      - run: npx playwright install chromium
        timeout-minutes: 10
      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.playwright }}
      - name: Restore browser system packages
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-apt-debs
          key: ci-apt-debs-browser-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/scripts/ci-system-packages.sh') }}
      - name: Install browser system packages
        id: packages
        timeout-minutes: 12
        run: bash .github/scripts/ci-system-packages.sh "${{ steps.debs.outputs.cache-hit }}" chromium
      - name: Save browser system packages
        if: steps.debs.outputs.cache-hit != 'true' && steps.packages.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ci-apt-debs
          key: ci-apt-debs-browser-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.playwright }}-${{ hashFiles('.github/scripts/ci-system-packages.sh') }}
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
