name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: portal_rls_test
          POSTGRES_USER: postgres
          # Public synthetic credential for this disposable CI container only.
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Release tests verify the pinned historical migration ancestor.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify migrated RLS and access-service revocation races
        run: npm run test:postgres
        env:
          POSTGRES_TEST_DISPOSABLE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: portal_rls_test
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
      - run: npx playwright install --with-deps chromium firefox
      - name: Install synthetic reference-audio test encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - name: Exercise browser HTTP authority and built production denial
        run: npm run test:http:browser
        env:
          POSTGRES_TEST_DISPOSABLE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: portal_rls_test
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
